# The dsh-multi-tenant bundle patch: the stateless multi-tenant backend over
# the dsh-web-app layer. Applied after web-app; it replaces the shared,
# locally-sandboxed execution world with the tenant container runtime and swaps
# in the tenant registry / authentication / agent-http carrier, disabling the
# single-user client-connection trust fence (agent-http mounts /api instead).
# Tenant records, Postgres coordinates, and auth material stay in the
# deployment's own patch layer (or env); this layer only expresses the
# provider swap.

# ── replace the local execution-and-isolation world ─────────────────────────

- id: session-persistence-jsonl
  disabled: true

# Single-user KV medium (`$DSH_HOME/storages`) is replaced by the
# (tenant, user)-keyed PostgreSQL storage backend below; the storage-domain row
# re-points at it.
- id: storage-json
  disabled: true

# These single-user consumers bootstrap by preloading their storage domain at
# init; the tenant-keyed PostgreSQL backend has no ambient tenant at boot, so
# that preload would throw. They stay per-request surfaces in a multi-tenant
# backend (re-enabled once a tenant-scoped preload exists).
- id: message-feedback
  disabled: true

- id: session-projection-cache
  disabled: true

- id: storage-domain
  config:
    backend: postgres

# Single-user file-backed settings + credentials (`$DSH_HOME/*` or a tenant's
# dataRoot on the host) are replaced by the (tenant, user)-keyed PostgreSQL
# providers below, so the agent plane keeps no host-side managed config files.
- id: settings
  disabled: true

- id: credentials
  disabled: true

# The host worker-thread code runtime runs model code in the agent process,
# where it could read host files and secrets; the tenant container backend
# below runs it off-host instead (the container is the isolation boundary).
- id: code-runtime
  disabled: true

# web-app disables the host worker-thread workflow engine and its tools (they
# execute model-written orchestration scripts in the agent process). The
# container engine below runs those scripts in the tenant container instead, and
# the tools are re-enabled so a tenant keeps the single-user workflow/ralph
# surface with in-container execution.
- id: tool-workflow
  disabled: false

- id: tool-ralph
  disabled: false

- id: subprocess
  disabled: true

- id: fs-sandbox
  disabled: true

- id: bash-sandbox
  disabled: true

# The host landlock/seatbelt executor is meaningless for container commands:
# the tenant container is the isolation boundary. sandbox-policy and approval
# stay mounted (the tool layer resolves its per-call workspace-write mode
# through them), pinned below to the only modes containers admit.
- id: sandbox
  disabled: true

# The permission-preset service bundles the sandbox mode on the mounted bash
# executor and ships a danger-full-access preset: neither maps to a tenant
# container, which always confines to its workspace. Its workspace-write + ask
# defaults carry over through the sandbox-policy / approval pins below.
- id: permission
  disabled: true

- id: sandbox-policy
  config:
    mode: workspace-write

- id: approval
  config:
    policy: ask

# agent-http owns /api now; the single-user DNS-rebinding fence must not also
# mount it, or webserver.register throws on the duplicate prefix.
- id: connection
  disabled: true

# Sessions default to the container workspace, never the Host process cwd
# (which does not exist inside the tenant container).
- id: api-gateway
  config:
    cwd: /workspace

# Present both the native tool surface and the Code Mode `run_code` tool
# (which runs in the tenant container through `code-runtime-container`), so a
# tenant keeps the single-user tool surfaces. The operator may still override
# through DSH_TOOLS_MODE (native|code|both); unset defaults to `both` here,
# unlike the base layer's `native`.
- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE || 'both'

# ── tenant container execution world ────────────────────────────────────────

- insert:
    # Every bound below ends a call that would otherwise stay pending: the
    # container CLI blocks for as long as a wedged daemon does, and a pending
    # start is what stops one subject's tool calls until the host restarts.
    # The CLI bound also has to cover `docker run -d` when the tool-exec image
    # is not yet local on this host (a pull runs inside that same call).
    - id: container-runtime
      name: '@deepseek-ai/dsh-container-docker'
      config:
        # A deployment patch that targets this row REPLACES this whole config
        # object (patch semantics assign each key of the patch onto the entry),
        # so it has to restate every field it wants to keep: usersRoot,
        # pythonRoot, and the bounds below. The ones omitted silently fall back
        # to their schema default, which for usersRoot and pythonRoot is no
        # value at all. Verify the effective tree with
        # `dsh --profile multi-tenant --dump-config`.
        usersRoot: !!js process.env.DSH_USERS_ROOT
        # The one Python runtime operations maintain on the host, mounted
        # read-only into every sandbox at this same absolute path: updating that
        # directory updates every sandbox's interpreter and dependencies, with no
        # image rebuild. The tool-exec image carries no Python, so this is the
        # sandbox's only interpreter and must be a complete relocatable build
        # (python-build-standalone install_only, or a conda environment) that runs
        # on the image's Debian 12 glibc.
        # The directory must be readable at this path by the host process itself, so
        # a harness running in its own container needs the host directory
        # mounted into it as well (docker/docker-compose.multi-tenant.yml).
        pythonRoot: /opt/.dsh/pyenv
        cliTimeoutMs: 60000
        startTimeoutMs: 180000
        transportTimeoutMs: 600000
        readyTimeoutMs: 10000
        readyPollMs: 30

    # Ambient case / user-global / system skill directories: the filesystem
    # skill provider reads `ctx.skillTiers` (registered here) to append the
    # three tier roots to its discovery, case > user-global > system.
    - id: skill-tier
      name: '@deepseek-ai/dsh-skill-tier'
      config:
        usersRoot: !!js process.env.DSH_USERS_ROOT

    # Ambient case / user-global / system tool-manifest directories: the tool
    # loader below reads `ctx.toolTiers` (registered here) to map data-only
    # manifests onto ranked tools, case > user-global > system.
    - id: tools-tier
      name: '@deepseek-ai/dsh-tools-tier'
      config:
        usersRoot: !!js process.env.DSH_USERS_ROOT

    # Declarative manifest tool loader: pure-data YAML manifests in the tier
    # directories become in-container subprocess tools registered per agent.
    - id: tools-manifest
      name: '@deepseek-ai/dsh-tools-manifest'
      config:
        defaultCwd: /workspace

    # Ambient session / case / user-global / system config directories: the
    # settings Service Definition reads `ctx.settingsTiers` (registered here)
    # to layer per-namespace files below the per-(tenant,user) runtime document,
    # session > case > user-global > system, with the PG document highest.
    - id: settings-tier
      name: '@deepseek-ai/dsh-settings-tier'
      config:
        usersRoot: !!js process.env.DSH_USERS_ROOT

    - id: subprocess-container
      name: '@deepseek-ai/dsh-subprocess-container'

    - id: bash-local
      name: '@deepseek-ai/dsh-bash-local'

    - id: fs-container
      name: '@deepseek-ai/dsh-fs-container'
      config:
        root: /workspace

    - id: code-runtime-container
      name: '@deepseek-ai/dsh-code-runtime-container'

    - id: workflow-container
      name: '@deepseek-ai/dsh-workflow-container'

    - id: session-persistence-postgres
      name: '@deepseek-ai/dsh-session-persistence-postgres'
      config:
        connectionString: !!js process.env.DSH_POSTGRES_URL

    - id: storage-postgres
      name: '@deepseek-ai/dsh-storage-postgres'
      config:
        connectionString: !!js process.env.DSH_POSTGRES_URL

    - id: tenant-admin-postgres
      name: '@deepseek-ai/dsh-tenant-admin-postgres'
      config:
        connectionString: !!js process.env.DSH_POSTGRES_URL

    - id: settings-postgres
      name: '@deepseek-ai/dsh-settings-postgres'

    - id: credentials-postgres
      name: '@deepseek-ai/dsh-credentials-postgres'

    # ── tenant carrier: registry, authentication, gateway ─────────────────────

    - id: tenant
      name: '@deepseek-ai/dsh-tenant'

    - id: tenant-admin
      name: '@deepseek-ai/dsh-tenant-admin'
      config:
        adminScope: dsh:tenant-admin
        usersRoot: !!js process.env.DSH_USERS_ROOT
        archiveRoot: !!js process.env.DSH_ARCHIVE_ROOT

    - id: tenant-auth-jwt
      name: '@deepseek-ai/dsh-tenant-auth-jwt'
      config:
        issuer: !!js process.env.DSH_OIDC_ISSUER
        secret: !!js process.env.DSH_OIDC_SECRET

    - id: agent-http
      name: '@deepseek-ai/dsh-agent-http'
# --- 提问必须有上界：本 profile 构造上没有交互客户端（纯 API、无浏览器） ---
# 没有回答者时 ask() 会一直挂着，回合永不闭合；进程一旦退出日志被撕开，
# 下次冷加载被恢复成静默的 interrupted 回合，用户的工作全部丢失且没有任何提示。
# 钉一个有界期限，让它变成工具返回失败结果、agent 带着假设继续走。
- id: user-questions
  config:
    answerTimeoutMs: 120000

# ── case-platform MCP servers (jeecg-boot-mcp-server) ───────────────────────
# One instance per serverKey, each registering its own `mcp__<serverName>__*`
# tools, mirroring the platform's `mcp_server` rows. The tool counts below are
# what each serverKey registered when this list was written; the platform owns
# the actual tool set, so a deployment reads it from the server, not here.
#
# ⚠️ THE URLS BELOW ARE THIS DEPLOYMENT'S, NOT THE PRODUCT'S — this block is
# what an operator edits when the case platform moves. `127.0.0.1:19830` is the
# mcp-server container's published port as seen from a DSH host that shares the
# host network. A DSH host on a container network must address the service by
# its own name and port instead (the Hermes deployment uses
# `http://jeecg-boot-mcp-server:19830/mcp/<serverKey>`); neither address
# resolves from the other side, and a wrong one fails at MCP connect, not at
# boot.
#
# Identity: the mcp-server reads case_id / user_id / session from the tools/call
# `_meta`; this client does not send `_meta` yet, so every case falls back to
# the server-side `icac.case-id` default.
#
# ⚠️ A deployment patch that already inserts any `mcp-icac-*` id must drop that
# row when this layer ships: a loader entry id may be inserted by one layer only,
# and a second insert is a duplicate-id failure at boot, not an override.
- insert:
    - id: mcp-icac-case          # 1 个工具 —— 案件基础信息
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: icac-case
        transport: streamable-http
        url: http://127.0.0.1:19830/mcp/case

    - id: mcp-icac-bill          # 31 个工具 —— 资金/账单
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: icac-bill
        transport: streamable-http
        url: http://127.0.0.1:19830/mcp/bill

    - id: mcp-icac-callrecord          # 17 个工具 —— 话单
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: icac-callrecord
        transport: streamable-http
        url: http://127.0.0.1:19830/mcp/callrecord

    - id: mcp-icac-property          # 12 个工具 —— 资产
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: icac-property
        transport: streamable-http
        url: http://127.0.0.1:19830/mcp/property

    - id: mcp-icac-relationship          # 3 个工具 —— 关系
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: icac-relationship
        transport: streamable-http
        url: http://127.0.0.1:19830/mcp/relationship

    - id: mcp-icac-trajectory          # 4 个工具 —— 轨迹
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: icac-trajectory
        transport: streamable-http
        url: http://127.0.0.1:19830/mcp/trajectory

    - id: mcp-icac-timeline          # 2 个工具 —— 时光轴
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: icac-timeline
        transport: streamable-http
        url: http://127.0.0.1:19830/mcp/timeline

    - id: mcp-icac-persona          # 42 个工具 —— 画像
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: icac-persona
        transport: streamable-http
        url: http://127.0.0.1:19830/mcp/persona

    - id: mcp-icac-specialized          # 29 个工具 —— 专项（微信/支付宝/税务/发票/快递）
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: icac-specialized
        transport: streamable-http
        url: http://127.0.0.1:19830/mcp/specialized

    - id: mcp-icac-doubt          # 5 个工具 —— 疑点模型
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: icac-doubt
        transport: streamable-http
        url: http://127.0.0.1:19830/mcp/doubt

    - id: mcp-icac-import          # 3 个工具 —— 数据导入
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: icac-import
        transport: streamable-http
        url: http://127.0.0.1:19830/mcp/import

    - id: mcp-icac-ai-analysis          # 11 个工具 —— 自然语言数据查询
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: icac-ai-analysis
        transport: streamable-http
        url: http://127.0.0.1:19830/mcp/ai-analysis
