services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dsh
      POSTGRES_PASSWORD: dsh-local
      POSTGRES_DB: dsh
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dsh -d dsh']
      interval: 2s
      timeout: 3s
      retries: 20