http:
  host: 0.0.0.0
  port: {{ .Values.service.tenant.port }}

database:
  connectionString: postgres://{{ .Values.middleware.database.user }}:{{ .Values.middleware.database.password }}@{{ .Values.middleware.database.host }}:{{ .Values.middleware.database.port }}/{{ .Values.middleware.database.name }}

auth:
  issuer: mt-deploy
  verify:
    kind: secret
    # 占位：由 Deployment 的 DSH_TENANT_OIDC_SECRET 覆盖；站点取值给真值。
    secret: {{ .Values.tenantConfig.auth.oidcSecret }}
  audience: dsh-tenant
  tenantIdClaim: tenant_id

admin:
  scope: dsh:tenant-admin

tenants:
  usersRoot: /opt/dsh/.dsh/users
  archiveRoot: /opt/dsh/.dsh/archive
  defaults:
    dataRoot: /opt/dsh/.dsh/tenants
    workspaceRoot: /opt/dsh/tenants
    toolsRoot: /opt/dsh/tools
    network: none

permissions:
  mode: workspace-write
  approval: ask

model:
  # 与下面 plugins.llm-pi-ai 里启用的 provider / model 对应；不匹配时下发 prompt 会以
  # model-unavailable 拒绝。
  provider: {{ .Values.tenantConfig.model.provider }}
  model: {{ .Values.tenantConfig.model.id }}

web:
  searchApiKeyEnv: {{ .Values.tenantConfig.web.searchApiKeyEnv }}

surfaces:
  # 控制台页面要前端产物，租户镜像不构建它；接口面看 /openapi.json 与 /swagger。
  openapi: true
  console: false
  adminOpenapi: true

tools:
  mode: {{ .Values.tenantConfig.tools.mode }}
  maxParallelSubCalls: {{ .Values.tenantConfig.tools.maxParallelSubCalls }}

{{- $assets := .Values.persistence.assets }}
{{- /* 资产卷启用时两层都从卷里认：<mountPath>/pyenv、<mountPath>/system；关掉则退回工作区
       claim 下的旧位置。卷内布局是程序的知识，因此只在这里出现，chart 只给挂载点。 */}}
{{- $pythonRoot := ternary (printf "%s/pyenv" $assets.mountPath) "/opt/dsh/.dsh/pyenv" $assets.enabled }}
{{- $systemRoot := ternary (printf "%s/system" $assets.mountPath) "/opt/dsh/.dsh/system" $assets.enabled }}
sandbox:
  backend: k8s
  namespace: {{ .Values.namespace }}
  image: {{ .Values.image.toolExec }}:{{ .Values.image.tag | default .Chart.AppVersion }}
  imagePullPolicy: {{ .Values.image.pullPolicy }}
  workspaceClaim: {{ .Values.persistence.workspace.name }}
  claimRoot: /opt/dsh
  systemRoot: {{ $systemRoot }}
  # 沙箱镜像里没有 Python：解释器与全部依赖来自宿主这个目录。节点上读不到时加载直接失败。
  pythonRoot: {{ $pythonRoot }}
  toolsRoot: /opt/dsh/tools
  # 沙箱内 Python 的三条路径：节点目录宿主读不到，所以逐项给出。
  pythonEnv:
    binDir: {{ $pythonRoot }}/bin
    virtualEnv: {{ $pythonRoot }}
    sitePackages: {{ $pythonRoot }}/lib/python3.11/site-packages
  {{- if $assets.enabled }}
  # 资产卷整块只读挂进沙箱：卷里有什么（pyenv/、system/、fonts/）由上面两行声明，
  # provider 不切子目录、也不解释布局。读不读某一层是程序自己的事，但必须都在。
  assetsClaim: {{ $assets.name }}
  assetsRoot: {{ $assets.mountPath }}
  {{- end }}
  idleTimeoutMs: {{ .Values.sandbox.idleTimeoutMs }}
  startTimeoutMs: {{ .Values.sandbox.startTimeoutMs }}
  toolTimeoutMs: {{ .Values.sandbox.toolTimeoutMs }}

# 每次 MCP 工具调用带的 _meta：键名必须是 jeecg-mcp-server 认的那三个
mcpMeta:
  fromHeaders:
    user_id: x-user-id
    case_id: x-case-id
    session: x-icac-session

# 12 组 MCP：走集群内 Service（与 icac01 生产同形，不经宿主 IP NodePort）。
# 每条 server 的 maxConcurrentCalls 是全宿主共用的硬闸；它们共用同一个后端进程，
# 所以各条 cap 之和就是打到那个后端的并发。写数据的工具放进 exclusiveTools。
mcpServers:
  - serverName: icac-platform
    transport: streamable-http
    url: {{ .Values.dependencies.mcpServerBaseUrl }}/mcp/platform
    failOnStartupError: false
    toolConcurrency: { policy: parallel, maxConcurrentCalls: 2 }
  - serverName: icac-case
    transport: streamable-http
    url: {{ .Values.dependencies.mcpServerBaseUrl }}/mcp/case
    failOnStartupError: true
    toolConcurrency: { policy: parallel, maxConcurrentCalls: 2 }
  - serverName: icac-bill
    transport: streamable-http
    url: {{ .Values.dependencies.mcpServerBaseUrl }}/mcp/bill
    failOnStartupError: false
    toolConcurrency: { policy: parallel, maxConcurrentCalls: 6 }
  - serverName: icac-callrecord
    transport: streamable-http
    url: {{ .Values.dependencies.mcpServerBaseUrl }}/mcp/callrecord
    failOnStartupError: false
    toolConcurrency: { policy: parallel, maxConcurrentCalls: 3 }
  - serverName: icac-property
    transport: streamable-http
    url: {{ .Values.dependencies.mcpServerBaseUrl }}/mcp/property
    failOnStartupError: false
    toolConcurrency: { policy: parallel, maxConcurrentCalls: 3 }
  - serverName: icac-relationship
    transport: streamable-http
    url: {{ .Values.dependencies.mcpServerBaseUrl }}/mcp/relationship
    failOnStartupError: false
    toolConcurrency: { policy: parallel, maxConcurrentCalls: 1 }
  - serverName: icac-trajectory
    transport: streamable-http
    url: {{ .Values.dependencies.mcpServerBaseUrl }}/mcp/trajectory
    failOnStartupError: false
    toolConcurrency: { policy: parallel, maxConcurrentCalls: 1 }
  - serverName: icac-timeline
    transport: streamable-http
    url: {{ .Values.dependencies.mcpServerBaseUrl }}/mcp/timeline
    failOnStartupError: false
    toolConcurrency: { policy: parallel, maxConcurrentCalls: 1 }
  - serverName: icac-persona
    transport: streamable-http
    url: {{ .Values.dependencies.mcpServerBaseUrl }}/mcp/persona
    failOnStartupError: false
    toolConcurrency: { policy: parallel, maxConcurrentCalls: 6 }
  - serverName: icac-specialized
    transport: streamable-http
    url: {{ .Values.dependencies.mcpServerBaseUrl }}/mcp/specialized
    failOnStartupError: false
    toolConcurrency: { policy: parallel, maxConcurrentCalls: 5 }
  - serverName: icac-doubt
    transport: streamable-http
    url: {{ .Values.dependencies.mcpServerBaseUrl }}/mcp/doubt
    failOnStartupError: false
    toolConcurrency: { policy: parallel, maxConcurrentCalls: 1 }
  - serverName: icac-import
    transport: streamable-http
    url: {{ .Values.dependencies.mcpServerBaseUrl }}/mcp/import
    failOnStartupError: false
    toolCallTimeoutMs: 600000
    toolConcurrency:
      policy: parallel
      maxConcurrentCalls: 1
      exclusiveTools: [upload_file]

# 文件面 /files：业务侧能写（并能删）哪些作用域。报告模板是主体自己维护的跨案件资产，
# 落在 global/报告模板/ 下，所以把 global 列进来；jeecg 侧 DSH_FILES_WRITABLE_SCOPES 是同一份清单。
# 沙箱那一侧的 /global 仍然只读，这里放开的只是业务面。
files:
  writableScopes: {{ .Values.tenantConfig.files.writableScopes | toJson }}

plugins:
  # 交付约定：产品侧的一条约定，放在部署 persona 里（不改 DSH 代码）。
  # 需要交给用户看的成品由模型用 present 工具声明，宿主的 deliverables 投影负责记住，
  # 业务侧（jeecg）只读投影并把沙箱路径翻成文件面地址，不再按工具名猜。
  system-prompt:
    config:
      persona: |
        交付约定：需要交给用户看的成品（报告、表格、导出的数据、图等），写完用 present 工具声明 —— 路径按你实际写入的位置给，每个文件配一句说明它是什么。没声明过的文件不会出现在用户的 本轮产物里；草稿、临时脚本、抽取的中间数据不要声明。
  plan-mode:
    enabled: true
    config:
      section: |
        You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

        Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

        The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed only to keep the request shape stable. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

        Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

        Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

        When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
  llm-pi-ai:
    enabled: true
    config:
      providers:
        {{ .Values.tenantConfig.model.provider }}:
          api: openai-completions
          baseURL: {{ .Values.tenantConfig.model.baseUrl }}
          apiKeyEnv: NEWAPI_API_KEY
          # 这条共享通道实测首字节 1.5-4.2 秒、抖动时 >10 秒；SDK 默认 10 秒会误判为超时
          timeoutMs: {{ .Values.tenantConfig.model.timeoutMs }}
          streamIdleTimeoutMs: {{ .Values.tenantConfig.model.streamIdleTimeoutMs }}
          displayName: {{ .Values.tenantConfig.model.providerDisplayName }}
          models:
            - id: {{ .Values.tenantConfig.model.id }}
              name: {{ .Values.tenantConfig.model.name }}
              maxTokens: {{ .Values.tenantConfig.model.maxTokens | int }}
              contextWindow: {{ .Values.tenantConfig.model.contextWindow | int }}
  compaction-basic:
    enabled: true
    config:
      thresholdRatio: 0.88
      retainRatio: 0.2
  compaction-tool-result-pruner:
    enabled: true
    config:
      thresholdChars: 32768
      headChars: 24576
      tailChars: 4096
  # 默认关着：这套部署只用一个 provider，多挂一个会让 model.provider 的解析多一处来源。
  llm-deepseek:
    enabled: false
  tool-skill-publish:
    enabled: true
    config:
      record:
        url: {{ .Values.dependencies.skillIngestUrl }}
        tokenEnv: DSH_SKILL_INGEST_TOKEN

mcp:
  external:
    enabled: true
    seedFromConfig: true
    allowPrivateHosts: true