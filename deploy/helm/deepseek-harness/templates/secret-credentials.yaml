{{- /*
可选 Secret：默认都不渲染。

现网在集群外手工建一次，五个 chart 共用同一把，
不该由单个 chart 拥有（各建一份同名 Secret 会互相覆盖）。
单仓独立部署时置 secrets.llm.create / secrets.tenant.create 为 true 并用 --set 给 data，
键名见 README「Secret 清单」。
*/}}
{{- if and .Values.secrets.llm.create .Values.secrets.llm.data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.llm.existingSecret }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "dsh.labels" (dict "root" . "component" .Values.names.tenantHost) | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml .Values.secrets.llm.data | nindent 2 }}
{{- end }}
{{- if and .Values.secrets.tenant.create .Values.secrets.tenant.data }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.tenant.existingSecret }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "dsh.labels" (dict "root" . "component" .Values.names.tenantHost) | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml .Values.secrets.tenant.data | nindent 2 }}
{{- end }}
