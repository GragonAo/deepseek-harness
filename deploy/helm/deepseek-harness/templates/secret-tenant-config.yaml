{{- if .Values.secrets.tenantConfig.create }}
{{- /*
租户配置正文在这里，正文本身在 files/tenant-config.yaml（原 manifests/secret-tenant-config.yaml
的 stringData 块，逐字节搬过来的 156 行）。

为什么拆成独立文件：正文有 150+ 行带业务语义的注释（沙箱目录为什么只读、并发上限的两层关系、
failOnStartupError 为什么必须 true），塞进 YAML 模板里既难读又容易被误改。
为什么过 tpl：正文里会随站点/机器变的值都写成了 values 引用（监听端口、数据库连接串、
沙箱命名空间与镜像、沙箱资源预算、对象存储端点、公开地址、模型通道），必须渲染一遍。
正文不含其它花括号，tpl 不会吃掉 YAML 内容。

正文里的 /opt/dsh/* 不是站点变量：它是镜像与 PVC 布局共同定死的宿主根，必须与
Deployment 的 volumeMounts[dsh].mountPath（/opt/dsh）一致，改一边就得改另一边。

⚠ 正文里的 mcpServers 段要填真 token，而 token 只能来自配置文件（applyEnvOverrides 不覆盖它），
  所以别把本 chart 渲染出来的这份直接盖到已经填好真值的 Secret 上 —— 那会把 token 换回占位符。
  生产环境置 secrets.tenantConfig.create=false，由部署机维护这份 Secret。

注意卷那一侧：Deployment 默认按 ConfigMap 挂（原清单的历史缺陷），
新环境请置 config.tenantConfig.volumeKind=secret 与之对应。
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.tenantConfig.existingSecret }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "dsh.labels" (dict "root" . "component" .Values.names.tenantHost) | nindent 4 }}
type: Opaque
# stringData 写明文、由 API 服务端编码；这份配置里有 MCP 请求头，所以它只能是 Secret。
stringData:
  tenant.config.yaml: |
    {{- include "dsh.tenantConfigBody" . | nindent 4 }}
{{- end }}
