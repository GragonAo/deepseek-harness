# 生产形态：租户服务宿主在 k8s 里的 Secret + Deployment + Service。
#
# 用法（在部署机上）：
#
#   bash docker/build-images.sh
#   docker save dsh-tenant:latest | ssh <节点> 'ctr -n k8s.io images import -'
#   kubectl -n dsh create secret generic dsh-tenant-secret \
#     --from-literal=DSH_TENANT_OIDC_SECRET=<与签发方共享的密钥> \
#     --from-literal=NEWAPI_API_KEY=<模型 key> \
#     --from-literal=DSH_OBJECT_ACCESS_KEY=<RGW 用户的 access key> \
#     --from-literal=DSH_OBJECT_SECRET_KEY=<RGW 用户的 secret key>
#   # 对象存储的桶与匿名只读策略是部署步骤，见 packages/tenant/object-store/README.md。
#   kubectl -n dsh apply -f docker/k8s/tenant-rbac.yaml   # 服务账号与沙箱权限，必须先于宿主
#   cp docker/k8s/tenant-host.yaml /tmp/dsh-tenant-host.yaml   # 本机副本，下面只改它
#   # 在副本里给 mcpServers 段的每条 server 填上真 token，再应用副本：仓库那份留占位符。
#   kubectl -n dsh apply -f /tmp/dsh-tenant-host.yaml
#
# 整份租户配置装进 Secret，而不是 ConfigMap。配置里的 mcpServers 段要写 MCP 请求头
# （`Authorization: Bearer <token>`），而请求头的值只能来自配置文件：环境变量覆盖只覆盖
# config.ts 里 applyEnvOverrides 列出的那几项，mcpServers 不在其中，所以“占位符 + 环境变量
# 替换”在它身上不生效。ConfigMap 是任何有 `get configmap` 权限的主体都能读的，Secret 至少
# 把它放进了 `kubectl get secret` 之后。命名空间的 Role 刻意不授予 secrets/configmaps 的
# 任何权限，而这份 Secret 由 kubelet 挂进容器——卷挂载不走 ServiceAccount，两边不冲突。
# 代价要说清：别把仓库这份 apply 到已经填好真值的 Secret 上，那会把 token 换回占位符。
#
# 密钥不进仓库：配置里 auth.verify.secret 只是占位值，由 DSH_TENANT_OIDC_SECRET 覆盖。
# 覆盖没生效时表现为第一次管理面调用返回 INVALID_TOKEN，而不是启动失败。
#
# 前提条件（属集群既有设施，不在这份清单里）：
#   - 命名空间 dsh、RWX StorageClass（沙箱工作区 PVC 用它）；
#   - PostgreSQL 服务 dsh-pg —— 现役形态见同目录的 pg.yaml（用托管库就改配置里的 connectionString）；
#   - 服务账号 dsh-host 及其 Role —— k8s 沙箱后端要按 (租户,用户) 建 Pod 与 PVC；
#   - 沙箱镜像 dsh-tool-exec:latest 已在节点上（k8s 回退到 Docker Hub，而部署网络通常拉不到）；
#   - 宿主目录 /opt/dsh（config 里的四条路径、systemRoot、pythonRoot 都在它下面）。
#
# 现役实例（130）的实际取值，排查时对照：
#   - 镜像 dsh-tenant:e2e-present2；沙箱执行层 dsh-tool-exec:icac-20261028-cba072acd8
#     （写在配置的 sandbox.image 里，本仓留 :latest 占位）；
#   - PVC dsh-workspace 30Gi `rook-cephfs`（RWX，沙箱 Pod 挂同一份）、dsh-pgdata 10Gi
#     `rook-ceph-block`（postgres 是集群既有设施，本仓不含它的清单）；
#   - Service dsh-tenant 用 NodePort 30788 对外；另有 dsh-host ClusterIP 8787 是我们早期
#     留下的孤儿（selector 是 app=dsh-host，而 Deployment 的标签是 app=dsh-tenant-host），
#     没有任何消费者，新环境不要照抄；
#   - 探针 httpGet /openapi.json：readiness 10s/10s、liveness 120s/30s、terminationGrace 30s。
#
# 两处现役与本文件的漂移，都是有意记录而非待办：
#   1) 130 把租户配置放在 ConfigMap `dsh-tenant-config` 里（挂 subPath 到
#      /etc/dsh/tenant.config.yaml），而本文件已经改成 Secret —— 因为配置里的 mcpServers
#      请求头是凭据，见上面第 18 行的理由。130 是这次加固之前的形态。
#   2) tenant-rbac.yaml 声明“Role 刻意不授予 secrets/configmaps 任何权限”，但 130 上的
#      dsh-host Role 实际给了 configmaps 的增删改查与 secrets 的读，且缺少 pods/log 的 get。
#      新环境按 tenant-rbac.yaml 建；收紧 130 需要单独验证排障路径。
apiVersion: v1
kind: Secret
metadata:
  name: __SECRET_TENANT_CONFIG__
  namespace: __NS_DSH__
type: Opaque
# stringData 写明文、由 API 服务端编码；这份配置里有 MCP 请求头，所以它只能是 Secret。
stringData:
  tenant.config.yaml: |
    http:
      host: 0.0.0.0
      port: 8788

    database:
      connectionString: postgres://__DSH_PG_USER__:__DSH_PG_PASSWORD__@__SVC_DSH_PG__:5432/__DSH_PG_DB__

    auth:
      issuer: mt-deploy
      verify:
        kind: secret
        # 占位：由 Deployment 的 DSH_TENANT_OIDC_SECRET 覆盖（见文件头）。
        secret: placeholder-overridden-by-env
      audience: dsh-tenant
      tenantIdClaim: tenant_id

    admin:
      scope: dsh:tenant-admin

    tenants:
      usersRoot: /opt/dsh/.dsh/users
      archiveRoot: /opt/dsh/.dsh/archive
      defaults:
        dataRoot: /opt/dsh/.dsh/tenants
        workspaceRoot: /opt/dsh/.dsh/tenants
        toolsRoot: /opt/dsh/.dsh/tools
        network: none

    permissions:
      mode: workspace-write
      approval: ask

    model:
      # 与下面 plugins.llm-pi-ai 里启用的 provider / model 对应；不匹配时下发 prompt 会以
      # model-unavailable 拒绝。
      provider: newapi
      model: qwen3.8-flash

    web:
      searchApiKeyEnv: DEEPSEEK_API_KEY

    surfaces:
      # 控制台页面要前端产物，租户镜像不构建它；接口面看 /openapi.json 与 /swagger。
      openapi: true
      console: false
      adminOpenapi: true

    sandbox:
      backend: k8s
      namespace: __NS_DSH__
      image: __IMG_TOOL_EXEC__:__TAG__
      imagePullPolicy: IfNotPresent
      # 执行容器的工作目录：/tmp 是沙箱自己的 emptyDir，不是挂载点。模型按相对路径写出的中间产物
      # 随沙箱销毁而消失，不会落进用户案件的工作目录；交付物由模型显式写到挂载的 /workspace。
      workDir: /tmp/work
    # 案件工作目录与用户跨案件工作目录对沙箱只读：它们由业务侧写入，沙箱只是读取方。
      # 可写就意味着一个用户的沙箱能改到同案件其他用户的输入。
      caseReadOnly: true
      usersReadOnly: true
      # 沙箱工作区是 RWX PVC：同一租户的多个沙箱 Pod 共用一棵工作区树。
      workspaceClaim: dsh-workspace
      claimRoot: /opt/dsh
      systemRoot: /opt/dsh/.dsh/system
      # 沙箱镜像里没有 Python：解释器与全部依赖来自宿主这个目录。节点上读不到时加载直接失败。
      pythonRoot: /opt/dsh/.dsh/pyenv
      toolsRoot: /opt/dsh/.dsh/tools
      # 沙箱内 Python 的三条路径：节点目录宿主读不到，所以逐项给出。
      pythonEnv:
        binDir: /opt/dsh/.dsh/pyenv/bin
        virtualEnv: /opt/dsh/.dsh/pyenv
        sitePackages: /opt/dsh/.dsh/pyenv/lib/python3.11/site-packages
      # 空闲预算：注入沙箱的 DSH_TOOL_EXEC_IDLE_MS，沙箱自己判定空闲后退出，退出后 Pod 停在
      # Succeeded，由宿主下一次启动时的收尸清掉。宿主不自己计时：多副本下它会删掉别人在用的沙箱。
      idleTimeoutMs: 900000
      # 沙箱容器的内存上界：落成 Pod 容器的 limits。越界时内核杀的是这个沙箱自己的 cgroup，
      # 而不是节点上别的负载。不配就没有内存上界（Pod 落在 BestEffort），生产必须配。
      # 有的集群会把 limits 回填成 requests，于是它同时是预留量、并参与能否调度的判断：
      # 本部署的节点 allocatable 只有 4 核，所以只锁内存、不配 cpuLimit。
      memoryLimit: 6Gi
      startTimeoutMs: 180000
      toolTimeoutMs: 600000

    tools:
      # 呈现方式：both 两种形态同时给——每个工具的原生 schema，加上 run_code 与一份生成的 SDK
      # 类型声明，模型按当下这件事挑一种；code 只留 run_code 通道；native 只给原生 schema。
      # 租户栈的默认值是 both，读一个文件、问一句这类会话不必写程序。上百个 MCP 工具的原生 schema
      # 靠案件级可见工具清单压住：`<tenant.workspaceRoot>/tools/restriction.yaml`
      # （allow/deny 两份全局工具名列表，见 @deepseek-ai/dsh-tools-restriction 的 README），
      # 它同时缩小原生 schema 段与 SDK 段。
      mode: both
      # 全局天花板：一个 run_code 程序在途的子调用总数不超过它，按**程序**算——每个会话各有一份，
      # 所以并发会话下打到 MCP 后端的并发还要乘上同时活跃的程序数。真正钉住后端的是每条 server
      # 自己的 cap。
      maxParallelSubCalls: 32

    # 每个 MCP 服务器挂成一个 mcp-client 实例，工具以 mcp__<serverName>__<原工具名> 注册。
    # 这些 server 全部按第三方对待：不由我们维护，所以不指望它们声明 `readOnlyHint` /
    # `idempotentHint`，mcp-client 的默认策略 annotations 在它们身上读不出并发意图，因此每条
    # server 都显式写 `toolConcurrency.policy: parallel`——并发的判断与责任由我们承担。
    # 两层上限的关系：每条 server 的 `maxConcurrentCalls` 是**分配**，而且是一道全宿主共用的硬闸
    # （所有会话、所有 run_code 程序一起走它）；全局 `maxParallelSubCalls` 是**天花板**，决定单个
    # 程序撒多宽。一批入口共用同一个后端进程时（同 host:port、只有路径不同），各条 cap 之和就是打到
    # 那个后端的并发，所以天花板设成后端扛得住的总量，再按各组扇出把 cap 分下去。
    # 一条 server 内部一旦真的并发，提交顺序就不再有任何保证：写数据的工具要放进 `exclusiveTools`
    # （它认的是这条 server 的 tools/list 报出的原名，写错会在那次工具同步时报出真正提供的名字）。
    # 认证走 `headers`；header 的值只能来自配置文件，所以整份配置从 Secret 挂进来（见文件头）。
    # `failOnStartupError: true` 逐条都写：客户端的默认值是 false，那时一次连不上只留一条日志，
    # 那一行安静地挂成“这个 server 没有工具”，与“配置错误必须响亮失败”相反。写成 true 后，地址
    # 写错或对方没起来会让启动直接失败，并在错误里指名那一行（组合行 mcp-<序号>-<serverName>）。
    # 整段省略就是用 mcp-client 自己的默认值（annotations 策略、10 路），租户侧不替它改。
    # 12 条入口（共用后端、逐条 cap 与 exclusiveTools）的完整形状见
    # docker/tenant.config.example.yaml 的 mcpServers 段。
    #
    # mcpServers:
    #   - serverName: icac-case
    #     transport: streamable-http
    #     url: http://mcp-gateway:19830/mcp/case
    #     headers: { Authorization: Bearer <token> }
    #     failOnStartupError: true
    #     toolConcurrency: { policy: parallel, maxConcurrentCalls: 2 }

    plugins:
      llm-pi-ai:
        enabled: true
        config:
          providers:
            newapi:
              api: openai-completions
              baseURL: https://coding.300188.cn/v1
              apiKeyEnv: NEWAPI_API_KEY
              displayName: newapi
              models:
                - id: qwen3.8-flash
                  name: Qwen3.8 Flash
                  maxTokens: 8192
                  contextWindow: 131072
      # 默认关着：这套部署只用一个 provider，多挂一个会让 model.provider 的解析多一处来源。
      llm-deepseek:
        enabled: false
      # 对象存储（见 packages/tenant/object-store/README.md）：endpoint 是本服务签名上传用的地址，
      # 集群内地址即可；publicBaseUrl 是写进模型回复、用户浏览器点的那个地址。两者写反不会报错但会
      # 产生取不到的链接，verifyPublic 让那种情况在发布时失败而不是把死链交给模型。bucket 必须已经
      # 开放匿名只读（桶与桶策略是部署步骤，不由服务创建）。两个密钥由 dsh-tenant-secret 提供，
      # 见文件头的 create secret 命令。
      object-store:
        enabled: true
        config:
          endpoint: __CEPH_RGW_ENDPOINT__
          bucket: dsh-public
          publicBaseUrl: __DSH_PUBLIC_BASE_URL__
          region: us-east-1
          forcePathStyle: true
          accessKeyEnv: DSH_OBJECT_ACCESS_KEY
          secretKeyEnv: DSH_OBJECT_SECRET_KEY
          # /global 挂载对应的宿主根（宿主的 /opt/dsh 与沙箱共用同一份 PVC）。
          usersRoot: /opt/dsh/.dsh/users
