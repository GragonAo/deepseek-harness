apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: dsh-tenant-host
  name: dsh-tenant-host
  namespace: __NS_DSH__
spec:
  progressDeadlineSeconds: 600
  replicas: __REPLICAS_TENANT__
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: dsh-tenant-host
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-11-02T09:54:47+08:00"
      creationTimestamp: null
      labels:
        app: dsh-tenant-host
    spec:
      containers:
      - env:
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              key: DEEPSEEK_API_KEY
              name: __SECRET_LLM__
        envFrom:
        - secretRef:
            name: __SECRET_TENANT__
        image: __IMG_TENANT__:__TAG__
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /openapi.json
            port: api
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 3
        name: tenant
        ports:
        - containerPort: 8788
          name: api
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /openapi.json
            port: api
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 3
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /opt/work/deepseek-harness/packages/mcp/mcp-client/lib/index.js
          name: mcp-client-patch
          readOnly: true
          subPath: index.js
        - mountPath: /opt/dsh
          name: dsh
        - mountPath: /etc/dsh/tenant.config.yaml
          name: config
          readOnly: true
          subPath: tenant.config.yaml
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: __SA_DSH__
      serviceAccountName: __SA_DSH__
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: __CM_MCP_PATCH__
        name: mcp-client-patch
      - name: dsh
        persistentVolumeClaim:
          claimName: __PVC_DSH_WS__
      - configMap:
          defaultMode: 420
          name: __SECRET_TENANT_CONFIG__
        name: config
