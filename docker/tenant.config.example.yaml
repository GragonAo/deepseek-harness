# 要让会话真的说话，就启用一个 LLM 插件行。下面是本地联调用过的一套；不启用时服务能起、
# 会话能建，但下发 prompt 会以 model-unavailable 拒绝。
#
# plugins:
#   # 逐行覆盖组合清单：停用某一行（enabled: false），或给某一行追加配置（config）。
#   # 行的 id 就是组合清单里的 id，见 tenant-app 的 spine.ts。
#   llm-pi-ai:
#     enabled: true
#     config:
#       providers:
#         newapi:
#           api: openai-completions
#           baseURL: https://coding.300188.cn/v1
#           apiKeyEnv: NEWAPI_API_KEY
#           models:
#             - id: qwen3.8-flash
#               name: Qwen3.8 Flash
#               maxTokens: 8192
#               contextWindow: 131072
#   plan-mode:
#     config:
#       # 计划模式生效时下发给模型的策略段落。plan-mode 按契约要求部署方写这段文案，
#       # 不给或给空串会让这一行启动失败（它不会替部署选一段）。
#       section: 计划模式已开启：先给出计划并等待确认，确认前不要修改文件，也不要执行有副作用的命令。
#   # 例：整行停用（终端工具只留 tool-terminal 那一条常驻 PTY 时）
